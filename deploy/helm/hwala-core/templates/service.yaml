apiVersion: v1
kind: Service
metadata:
  name: {{ include "hwala-core.fullname" . }}-api
  labels:
    {{- include "hwala-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "hwala-core.apiSelectorLabels" . | nindent 4 }}
