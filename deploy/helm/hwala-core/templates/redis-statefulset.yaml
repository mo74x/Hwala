{{- if .Values.redis.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hwala-core.fullname" . }}-redis
  labels:
    {{- include "hwala-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "hwala-core.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "hwala-core.redisSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hwala-core.redisSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.redis.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hwala-core.fullname" . }}-redis
  labels:
    {{- include "hwala-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "hwala-core.redisSelectorLabels" . | nindent 4 }}
{{- end }}
