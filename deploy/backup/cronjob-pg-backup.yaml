apiVersion: batch/v1
kind: CronJob
metadata:
  name: hwala-postgres-backup
  namespace: hwala-production
  labels:
    app.kubernetes.io/name: hwala-core
    app.kubernetes.io/component: db-backup
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: db-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups/postgres"
                  FILE_NAME="hwala_db_backup_${TIMESTAMP}.sql.gz"
                  mkdir -p ${BACKUP_DIR}

                  echo "[$(date)] Starting PostgreSQL backup..."
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump -h ${POSTGRES_HOST} -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip > ${BACKUP_DIR}/${FILE_NAME}
                  echo "[$(date)] Backup completed: ${FILE_NAME}"

                  # Retention: Remove backups older than 30 days
                  find ${BACKUP_DIR} -name "hwala_db_backup_*.sql.gz" -mtime +30 -exec rm {} \;
                  echo "[$(date)] Retention cleanup finished."
              env:
                - name: POSTGRES_HOST
                  value: "hwala-core-postgres"
                - name: POSTGRES_USER
                  value: "hawala_user"
                - name: POSTGRES_DB
                  value: "hawala_db"
                - name: POSTGRES_PASSWORD
                  value: "hawala_password"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: hwala-backup-pvc
