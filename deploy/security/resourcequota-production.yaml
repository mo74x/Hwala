apiVersion: v1
kind: ResourceQuota
metadata:
  name: hwala-production-quota
  namespace: hwala-production
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "50"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hwala-production-limits
  namespace: hwala-production
spec:
  limits:
    - default:
        cpu: 2000m
        memory: 2Gi
      defaultRequest:
        cpu: 500m
        memory: 512Mi
      type: Container
