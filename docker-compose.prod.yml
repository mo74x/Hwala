version: '3.8'

services:
  hwala-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hwala-api
    restart: unless-stopped
    env_file:
      - .env.production.local
    ports:
      - "3000:3000"
    networks:
      - hwala-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  hwala-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hwala-worker
    restart: unless-stopped
    env_file:
      - .env.production.local
    environment:
      WORKER_MODE: "true"
    networks:
      - hwala-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: hwala-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: hawala_user
      POSTGRES_PASSWORD: hawala_password
      POSTGRES_DB: hawala_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - hwala-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawala_user -d hawala_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hwala-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    networks:
      - hwala-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  hwala-net:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
