name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:
jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: tenki-standard-small-2c-4g
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run NPM Audit for Production Dependencies
        run: npm audit --production --audit-level=high

  codeql-sast:
    name: CodeQL Static Analysis (SAST)
    runs-on: tenki-standard-small-2c-4g
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:typescript"

  container-cve-scan:
    name: Container CVE Vulnerability Scan
    runs-on: tenki-standard-small-2c-4g
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Local Image for Scanning
        run: docker build -t hwala-core:security-scan .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hwala-core:security-scan'
          format: 'sarif'
          output: 'trivy-security-audit.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan to GitHub Security Advisories
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-security-audit.sarif'
          category: 'weekly-trivy-scan'